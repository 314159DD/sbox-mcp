name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build plugin/sbox-mcp.csproj -c Release --nologo
      - run: dotnet test plugin/tests/sbox-mcp.tests.csproj --nologo
